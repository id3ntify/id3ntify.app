name: Report a problem
description: Something isn't working as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Tip: in the app, open **Help & feedback → Copy diagnostics** and paste the result below. It includes versions and settings, with keys and your Windows user name removed.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: e.g. Bulk identification stopped at song 12 with an error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Bulk identification
        2. Load a folder with ...
        3. ...
  - type: input
    id: version
    attributes:
      label: ID3ntify version
      placeholder: e.g. 0.5.1 (shown at the bottom of the menu)
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Help & feedback → Copy diagnostics, then paste here.
      render: text
