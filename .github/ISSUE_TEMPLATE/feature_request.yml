name: Request a feature
description: Suggest an idea that would make ID3ntify better.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to be able to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: Tell us about your music library or the situation where you'd use it.
